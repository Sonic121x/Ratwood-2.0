author: "hugmeorelse"
delete-after: True
changes:
  - sound: "为火焰、火炬、喷泉、时钟、尸体等添加了具有空间定位的局部环境音。"
  - sound: "添加持续河声，会随附近河流覆盖范围变化，并在室内减弱。"
  - sound: "改善环境音的淡入淡出、方向过渡、声源切换及变化。"
  - sound: "将乐器、音乐盒及其他持续音效迁移至新的声音框架。"
  - sound: "新增声音遮挡，并调整相关音效的距离衰减和传播范围限制。"
  - qol: "重新组织音频设置，加入主音量、乐器和局部环境音控制，分别控制管理员声音与流媒体音频，并支持编辑百分比和查看悬浮说明。"
  - qol: "局部环境音可独立于主音量控制。"
  - bugfix: "修复听者之间的声音状态串扰、远处爆炸和教堂钟声的衰减，以及若干循环音启动和清理问题。"
  - bugfix: "修复后的带窗门会保留透明性。"
  - admin: "新增声音诊断、实时局部环境音控制及统计报告。"
  - config: "在 config/sound.txt 中新增附带说明的声音和局部环境音设置。"
